<!DOCTYPE html>
<html lang="en">
<head>

    <title>Unit 1 | Anders Moranchek</title>
    <style>
        :root {
            --green: #238636;
            --dark: #17351f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #222;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        header {
            padding: 2rem 1rem;
            color: white;
            text-align: center;
            background: var(--green);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        nav {
            background: var(--dark);
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 0;
            padding: 0.75rem 1rem;
            list-style: none;
        }

        nav a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        nav a:hover,
        nav a:focus {
            color: #b7e4c1;
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h2 {
            color: var(--green);
        }

        figure {
            margin: 1.5rem 0;
            text-align: center;
        }

        .figure-title {
            margin-bottom: 0.75rem;
            color: var(--green);
            font-size: 1.2rem;
            font-weight: bold;
        }

        img {
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            margin: 0 auto;
            border: 2px solid var(--dark);
            background: #f5f5f5;
        }

        .blog-section {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 2px solid #dfe7df;
        }

        .blog-section h3 {
            margin: 0 0 0.75rem;
            color: var(--green);
            font-size: 1.4rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Anders Moranchek</h1>
    </header>

    <nav aria-label="Main navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about-me">About Me</a></li>
            <li><a href="unit-1.html" aria-current="page">Unit 1</a></li>
        </ul>
    </nav>

    <main>
        <section aria-labelledby="unit-heading">
            <h2 id="unit-heading">Unit 1</h2>

            <figure>
                <div class="figure-title">My Cactus Phenomenon Brainstorm</div>
                <img src="cactus-brainstorm.png" alt="My Cactus Phenomenon Brainstorm">

            <div class="blog-section">
